<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
<script src="js/lightweight-charts.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;background:#111;color:#fff;font-family:sans-serif}
#status{padding:10px;background:#1a1a2e;margin:5px;border-radius:4px;font-size:13px}
</style>
</head>
<body>
<div id="status">Loading...</div>
<div id="chart" style="width:100%;height:calc(100vh - 60px);background:#131722"></div>
<script>
try {
  document.getElementById('status').textContent = 'LightweightCharts: ' + (typeof LightweightCharts);
  if (typeof LightweightCharts !== 'undefined') {
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
      width: window.innerWidth,
      height: window.innerHeight - 60,
      layout: { background:{color:'#131722'}, textColor:'#d1d4dc' },
      grid: { vertLines:{color:'#1e222d'}, horzLines:{color:'#1e222d'} },
      timeScale: { timeVisible:true, secondsVisible:false }
    });
    const series = chart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor:'#26a69a', downColor:'#ef5350'
    });
    const t = Math.floor(Date.now()/1000) - 86400*30;
    let p = 50000;
    const data = [];
    for(let i=0;i<100;i++){
      p += (Math.random()-0.5)*500;
      data.push({time: t+i*3600, open: p-20, high: p+50, low: p-50, close: p+10, volume: Math.random()*10000});
    }
    series.setData(data);
    chart.timeScale().fitContent();
    document.getElementById('status').textContent = 'Chart OK - candles: ' + data.length;
  }
} catch(e) {
  document.getElementById('status').textContent = 'ERROR: ' + e.message;
}
</script>
</body>
</html>
