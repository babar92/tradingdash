<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Dashboard</title>
  <script src="js/lightweight-charts.js"></script>
  <script src="js/socket.io.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#131722">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <div class="top-bar">
      <div class="top-bar-left">
        <span class="app-title">TRADING DASHBOARD</span>
        <label>
          Charts:
          <select id="chart-count">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="4">4</option>
            <option value="6">6</option>
            <option value="8">8</option>
          </select>
        </label>
      </div>
    </div>
    <div class="main-content">
      <div id="chart-grid"></div>
      <div id="watchlist-panel"></div>
    </div>
  </div>

  <script src="js/indicators.js"></script>
  <script src="js/grid-manager.js"></script>
  <script src="js/data-bridge.js"></script>
  <script src="js/drawings.js"></script>
  <script src="js/chart-pane.js"></script>
  <script src="js/watchlist.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
