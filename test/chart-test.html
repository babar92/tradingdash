<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
body { margin:0; background:#131722; }
#chart { width:100vw; height:100vh; }
</style>
</head>
<body>
<div id="chart"></div>
<script>
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  width: window.innerWidth, height: window.innerHeight,
  layout: { background:{color:'#131722'}, textColor:'#d1d4dc' },
  grid: { vertLines:{color:'#1e222d'}, horzLines:{color:'#1e222d'} },
  timeScale: { timeVisible:true, secondsVisible:false }
});
const series = chart.addCandlestickSeries({
  upColor:'#26a69a', downColor:'#ef5350',
  borderUpColor:'#26a69a', borderDownColor:'#ef5350',
  wickUpColor:'#26a69a', wickDownColor:'#ef5350'
});
const data = [];
let t = Math.floor(Date.now()/1000) - 86400*30;
let price = 50000;
for(let i=0;i<200;i++) {
  price += (Math.random()-0.5)*500;
  data.push({
    time: t + i*3600,
    open: price + (Math.random()-0.5)*100,
    high: price + Math.random()*200,
    low: price - Math.random()*200,
    close: price + (Math.random()-0.5)*100,
    volume: Math.random()*10000
  });
}
series.setData(data);
chart.timeScale().fitContent();
</script>
</body>
</html>
